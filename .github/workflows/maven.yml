  name: Java CI with Ubuntu

  on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

  permissions:
    contents: write

  jobs:
    build:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: catalogolibros

      steps:
        - uses: actions/checkout@v7
        - name: Set up JDK 21
          uses: actions/setup-java@v6
          with:
            java-version: '21'
            distribution: 'temurin'